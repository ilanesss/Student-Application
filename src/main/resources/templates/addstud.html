<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg mb-4" style="background-color: #800000;">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color: #dc3545;" th:href="@{/}">Student Portal</a>
        <div>
            <a class="btn btn-outline-light" th:href="@{/students}">Back to List</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Add New Student</h4>
        </div>
        <div class="card-body">

            <!-- Validation Error Alert -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}">
                Invalid exam score!
            </div>

            <form th:action="@{/students/add}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="name" name="name" th:value="${student.name}" required placeholder="Enter first name">
                </div>

                <div class="mb-3">
                    <label for="surname" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="surname" name="surname" th:value="${student.surname}" required placeholder="Enter last name">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" th:value="${student.email}" required placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label for="age" class="form-label">Age</label>
                    <input type="number" class="form-control" id="age" name="age" th:value="${student.age}" required min="16" max="100" placeholder="Enter age">
                </div>

                <div class="mb-3">
                    <label for="exam" class="form-label">Exam Result (0 - 100)</label>
                    <input type="number" class="form-control" id="exam" name="exam" th:value="${student.exam}" required min="0" max="100" placeholder="Enter exam score (0-100)">
                    <div class="form-text">The grade (A, B, C, D, F) will be calculated automatically upon submission.</div>
                </div>

                <div class="d-flex justify-content-between pt-2">
                    <a th:href="@{/students}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-success">Save Student</button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
