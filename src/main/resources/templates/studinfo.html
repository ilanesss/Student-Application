<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Details - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg mb-4" style="background-color: #800000;">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color: #dc3545;" th:href="@{/}">Student Portal</a>
        <div>
            <a class="btn btn-outline-light" th:href="@{/students}">Back to List</a>
        </div>
    </div>
</nav>

<div class="container" style="max-width: 550px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Student Profile Information</h4>
        </div>
        <div class="card-body">
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">ID:</span>
                    <span class="badge bg-secondary rounded-pill" th:text="${student.id}">1</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">First Name:</span>
                    <span th:text="${student.name}">First Name</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">Last Name:</span>
                    <span th:text="${student.surname}">Last Name</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">Email Address:</span>
                    <span th:text="${student.email}">email@example.com</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">Age:</span>
                    <span th:text="${student.age}">20</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">Exam Score:</span>
                    <span th:text="${student.exam}">85</span>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold text-muted">Calculated Grade:</span>
                    <span class="badge fs-6"
                          th:classappend="${student.mark == 'A' ? 'bg-success' :
                                               (student.mark == 'B' ? 'bg-primary' :
                                               (student.mark == 'C' ? 'bg-info text-dark' :
                                               (student.mark == 'D' ? 'bg-warning text-dark' : 'bg-danger')))}"
                          th:text="${student.mark}">A</span>
                </li>
            </ul>
            <div class="d-grid">
                <a th:href="@{/students}" class="btn btn-outline-danger">Return to Student List</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
