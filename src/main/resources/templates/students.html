<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg mb-4" style="background-color: #800000;">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color: #dc3545;" th:href="@{/}">Student Portal</a>
        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/}">Home</a>
            <a class="btn btn-success" th:href="@{/students/add}">Add Student</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Registered Students List</h2>
        <a th:href="@{/students/add}" class="btn btn-success">+ Add New Student</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email Address</th>
                    <th>Age</th>
                    <th>Exam Score</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="std : ${students}">
                    <td th:text="${std.id}">1</td>
                    <td th:text="${std.name}">Name</td>
                    <td th:text="${std.surname}">Surname</td>
                    <td th:text="${std.email}">name.surname@example.com</td>
                    <td th:text="${std.age}">20</td>
                    <td th:text="${std.exam}">85</td>
                    <td>
                                <span class="badge fs-6"
                                      th:classappend="${std.mark == 'A' ? 'bg-success' :
                                                       (std.mark == 'B' ? 'bg-primary' :
                                                       (std.mark == 'C' ? 'bg-info text-dark' :
                                                       (std.mark == 'D' ? 'bg-warning text-dark' : 'bg-danger')))}"
                                      th:text="${std.mark}">A</span>
                    </td>
                    <td>
                        <a th:href="@{/students/{id}(id=${std.id})}" class="btn btn-danger btn-sm text-white me-1">Details</a>
                        <form th:action="@{/students/delete/{id}(id=${std.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-secondary btn-sm" onclick="return confirm('Are you sure you want to delete this student?')">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="8" class="text-center text-muted py-4">No students found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
