<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --dark-red: #8b0000;
            --dark-red-hover: #660000;
        }

        .bg-dark-red {
            background-color: var(--dark-red) !important;
        }

        .btn-dark-red {
            background-color: var(--dark-red);
            color: #ffffff;
            border: none;
        }

        .btn-dark-red:hover {
            background-color: var(--dark-red-hover);
            color: #ffffff;
        }

        .table-dark-red {
            background-color: var(--dark-red);
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark-red shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/}">Student Portal</a>
        <a th:href="@{/students/new}" class="btn btn-outline-light btn-sm">+ Add New Student</a>
    </div>
</nav>

<div class="container">
    <!-- Search and Filter Card -->
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-body p-4">
            <h5 class="card-title fw-bold mb-3 text-secondary">Filter & Search Students</h5>
            <form th:action="@{/students}" method="get" class="row g-3 align-items-end">

                <div class="col-md-4">
                    <label for="keyword" class="form-label fw-semibold">Search Name or Surname</label>
                    <input type="text" class="form-control" id="keyword" name="keyword"
                           th:value="${keyword}" placeholder="e.g. Alice">
                </div>

                <div class="col-md-3">
                    <label for="minExam" class="form-label fw-semibold">Min Score</label>
                    <input type="number" class="form-control" id="minExam" name="minExam"
                           th:value="${minExam}" placeholder="e.g. 50" min="0" max="100">
                </div>

                <div class="col-md-3">
                    <label for="maxExam" class="form-label fw-semibold">Max Score</label>
                    <input type="number" class="form-control" id="maxExam" name="maxExam"
                           th:value="${maxExam}" placeholder="e.g. 90" min="0" max="100">
                </div>

                <div class="col-md-2 d-flex gap-2">
                    <button type="submit" class="btn btn-dark-red w-100">Search</button>
                    <a th:href="@{/students}" class="btn btn-outline-secondary">Reset</a>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark-red">
                    <tr>
                        <th scope="col" class="ps-3">#</th>
                        <th scope="col">First Name</th>
                        <th scope="col">Last Name</th>
                        <th scope="col">Email</th>
                        <th scope="col">Age</th>
                        <th scope="col">Exam Score</th>
                        <th scope="col">Grade</th>
                        <th scope="col" class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="std, iterStat : ${students}">
                        <td class="fw-bold ps-3" th:text="${iterStat.count}">1</td>
                        <td th:text="${std.name}">John</td>
                        <td th:text="${std.surname}">Doe</td>
                        <td th:text="${std.email}">john.doe@example.com</td>
                        <td th:text="${std.age}">20</td>
                        <td th:text="${std.exam}">85</td>
                        <td>
                                    <span class="badge fs-6"
                                          th:classappend="${std.mark == 'A' ? 'bg-success' :
                                                           (std.mark == 'B' ? 'bg-primary' :
                                                           (std.mark == 'C' ? 'bg-info text-dark' :
                                                           (std.mark == 'D' ? 'bg-warning text-dark' : 'bg-danger')))}"
                                          th:text="${std.mark}">A</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/students/{id}(id=${std.id})}"
                               class="btn btn-dark-red btn-sm me-1">Details</a>

                            <form th:action="@{/students/delete/{id}(id=${std.id})}"
                                  method="post" style="display:inline;">
                                <button type="submit" class="btn btn-outline-danger btn-sm"
                                        onclick="return confirm('Are you sure you want to delete this student?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="8" class="text-center py-4 text-muted">
                            No students found matching your criteria.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
