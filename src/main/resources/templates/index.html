<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg mb-4" style="background-color: #800000;">
    <div class="container">
        <a class="navbar-brand fw-bold" style="color: #dc3545;" th:href="@{/}">Student Portal</a>
        <div>
            <a class="btn btn-outline-light me-2" th:href="@{/students}">View All Students</a>
            <a class="btn btn-success" th:href="@{/students/add}">Add Student</a>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container">
    <div class="p-5 mb-4 bg-white rounded-3 shadow-sm border">
        <div class="container-fluid py-3 text-center">
            <h1 class="display-5 fw-bold text-danger">Student Management Application</h1>
            <p class="col-md-8 fs-4 mx-auto text-muted mt-3">
                Application for Browsing Students
            </p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <a th:href="@{/students}" class="btn btn-danger btn-lg px-4">Browse Student List</a>
                <a th:href="@{/students/add}" class="btn btn-outline-secondary btn-lg px-4">Add New Student</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
